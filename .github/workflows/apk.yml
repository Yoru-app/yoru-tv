name: APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shikimori app (from repository secrets, optional)
        run: |
          echo "shiki.clientId=${{ secrets.SHIKI_CLIENT_ID }}" >> local.properties
          echo "shiki.clientSecret=${{ secrets.SHIKI_CLIENT_SECRET }}" >> local.properties
          echo "shiki.appName=${{ secrets.SHIKI_APP_NAME }}" >> local.properties
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoru-tv-debug
          path: app/build/outputs/apk/debug/*.apk
